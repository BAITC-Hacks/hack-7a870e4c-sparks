services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: career
      POSTGRES_DB: career_quest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - career_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career_quest"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  agent:
    init: true
    build:
      context: apps/agent
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${OPENAI_KEY:-}}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
    restart: unless-stopped
    stop_grace_period: 15s
  api:
    init: true
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 3001
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://career:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/career_quest?schema=public
      DATASET_PATH: /app/case_1/career_quest_dataset
      HR_PASSWORD: ${HR_PASSWORD:?Set HR_PASSWORD in .env}
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:?Set CREDENTIAL_SECRET in .env}
      DEMO_EMPLOYEE_ID: ${DEMO_EMPLOYEE_ID:-E0005}
      DEMO_EMPLOYEE_PASSWORD: ${DEMO_EMPLOYEE_PASSWORD:-}
      AGENT_URL: http://agent:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
  web:
    init: true
    build:
      context: apps/web
      args:
        API_INTERNAL_URL: http://api:3001
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ru/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

volumes:
  career_postgres_data:
